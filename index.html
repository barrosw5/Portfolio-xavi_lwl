<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - xavi_lwl</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- GSAP -->
    <script src="libs/gsap.min.js"></script>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <h1 class="hero-title">xavi_lwl</h1>
        <!-- FIXED TOP NAVBAR -->
        <nav class="top-bar">
            <a href="#about">About</a>
            <a href="#gallery">Gallery</a>
        </nav>
    </header>

    <!-- ABOUT SECTION -->
    <section id="about" class="about-me">
        <div class="profile-icon">
            <img src="assets/Portifolio/xavi_lwl-icon.jpg" alt="profile pic">
        </div>
        <div class="about-text">
            <h2>Hello! I'm Xavi</h2>
            <p>Me a artist. Me a animator. Me crazy.</p>
        </div>
    </section>

    <!-- GALLERY SECTION -->
    <section id="gallery" class="gallery">
        <!-- Category Boxes -->
         <div class="category-box" data-category="characters" style="background-image: url('assets/Portifolio/Character desein/Post Rat Boy.jpg');">
            <div class="box-overlay">Character Design</div>
        </div>
        <div class="category-box" data-category="fanarts" style="background-image: url('assets/Portifolio/Fanarts/Sabá pela boat.jpg');">
            <div class="box-overlay">Fanarts</div>
        </div>
        <div class="category-box" data-category="animations" style="background-image: url('assets/Portifolio/Animations/animation.png');">
            <div class="box-overlay">Animations</div>
        </div>
        <div class="category-box" data-category="projects" style="background-image: url('assets/Portifolio/Bad Bet/Artfight karpos.jpg');">
            <div class="box-overlay">Other projects</div>
        </div>

        <!-- Hidden gallery -->
        <div class="hidden-gallery" aria-hidden="true">
            <button class="back-btn">← Back</button>
            <div class="hidden-gallery-track"></div>
            <!-- Expanded Art Panel -->
            <div class="art-expanded" aria-hidden="true">
                <div class="art-expanded-left">
                    <img src="" alt="">
                </div>
                <div class="art-expanded-right">
                    <h3 class="art-title"></h3>
                    <p class="art-description"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <a href="https://x.com/xavi_lwl" target="_blank">X</a>
        <a href="https://www.instagram.com/xavi_lwl/" target="_blank">Instagram</a>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
