<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - xavi_lwl</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <section id="about" class="about-me">
        <div class="profile-icon">

    <section id="gallery" class="gallery">
        <div class="art-item"><img src="assets/images/art1.jpg" alt="Art 1"></div>
        <div class="art-item"><img src="assets/images/art2.jpg" alt="Art 2"></div>
        <div class="art-item"><img src="assets/images/art3.jpg" alt="Art 3"></div>
        <!-- Add more art items as needed -->

    <!-- FOOTER -->
    <footer class="footer">
        <a href="https://twitter.com/" target="_blank">Twitter</a>
